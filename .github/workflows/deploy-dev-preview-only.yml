name: Preview frontend on GitHub Pages (PRs into dev)

on:
  pull_request:
    branches: ["dev"]
    paths:
      - "frontend/**"

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages-preview"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular (preview)
        run: npx ng build --configuration production --base-href ./ --output-path docs

      - name: Prepare Pages files
        run: |
          touch docs/browser/.nojekyll
          cp docs/browser/index.html docs/browser/404.html

      - name: Upload artifact (frontend/docs/browser)
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/docs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: github-pages
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          preview: true

      - name: Comment preview link on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            **Preview deployed successfully!**
            [View Deployment](${{ steps.deployment.outputs.page_url }})

            *(Temporary preview for this PR — auto-updated on every push.)*
