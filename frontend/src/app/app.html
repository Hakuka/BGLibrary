<app-header-menu (menuSelected)="selectedMenuOption = $event" />
<main>
  @switch (selectedMenuOption) {
    @case ("menu1") {
      @defer (on immediate) {
        <app-games-view />
      }
    }
    @case ("menu2") {
      @defer (on immediate) {
        <app-borrowed-view />
      }
    }
    @case ("menu3") {
      @defer (on immediate) {
        <app-menage />
      }
    }
    @default {
      <div id="fallback">
        <p>Welcome, select an option at the top to get started :)</p>
        <p>Current state of project:</p>
        <p><img src="assets/meme1.jpg" alt="meme1" /></p>
      </div>
    }
  }
</main>
