<app-modal label="Borrow a game" (dismissed)="onCancel()">
  <form #f="ngForm" (ngSubmit)="onSubmit()" class="modal-card">
    <app-control label="Game" forId="Game" [required]="true">
      <select
        id="Game"
        name="Game"
        class="form-select"
        [(ngModel)]="enteredGame"
        (ngModelChange)="onGameChange()"
        required
      >
        <option disabled value="">Select a game</option>
        @for (game of games; track game.id){
        <option [value]="game.id">{{ game.name }}</option>
        }
      </select>
    </app-control>

    <!-- only copies from selected game-->
    <app-control label="Copy" forId="Copy" [required]="true">
      <select
        id="Copy"
        name="Copy"
        class="form-select"
        [(ngModel)]="enteredCopy"
        (ngModelChange)="onCopyChange($event)"
        required
        [disabled]="!enteredGame"
      >
        <option disabled value="">Select a copy</option>
        @for (copy of copies; track copy.id){ @if (copy.gameId === enteredGame &&
        copy.borrowed==='N') {
        <option [value]="copy.id">{{ copy.id }}</option>
        } }
      </select>
    </app-control>

    <app-control label="Responsible Person" forId="Person" [required]="false">
      <input
        type="text"
        id="Person"
        name="Person"
        class="form-control"
        [(ngModel)]="enteredResponsiblePerson"
      />
    </app-control>

    <app-control label="Weight" forId="Weight" [required]="true">
      <input
        type="number"
        step="0.01"
        id="Weight"
        name="Weight"
        class="form-control"
        [(ngModel)]="enteredWeight"
        required
      />
    </app-control>

    <app-control label="Comment" forId="Comment" [required]="false">
      <textarea
        id="Comment"
        name="Comment"
        class="form-control"
        rows="3"
        [(ngModel)]="enteredComment"
      ></textarea>
    </app-control>

    <app-button-group>
      <button app-button buttonType="button" variant="secondary" (buttonClick)="onCancel()">
        Cancel
      </button>
      <button
        app-button
        buttonType="submit"
        variant="primary"
        [disabled]="f.invalid || !enteredGame || !enteredCopy"
      >
        Borrow
      </button>
    </app-button-group>
  </form>
</app-modal>
