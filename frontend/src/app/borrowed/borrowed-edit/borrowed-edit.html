<modal (backdropClick)="onCancel()">
  <form #f="ngForm" (ngSubmit)="onSubmit()" class="modal-card">
    <control label="Game" forId="Game" [required]="false">
      <span class="input-group-text" id="Game">{{ selectedGame?.name }}</span>
    </control>

    <control label="Copy" forId="Copy" [required]="false">
      <span class="input-group-text" id="Copy">{{ displayedCopy.id }}</span>
    </control>

    <control label="Responsible Person" forId="person" [required]="false">
      <input
        type="text"
        id="person"
        name="person"
        class="form-control"
        [(ngModel)]="editedDisplayedCopy.responsiblePerson"
      />
    </control>

    <control label="Weight" forId="Weight" [required]="true">
      <input
        type="number"
        step="0.01"
        id="Weight"
        name="Weight"
        class="form-control"
        [(ngModel)]="editedDisplayedCopy.weight"
        required
      />
    </control>

    <control label="Comment" forId="Comment" [required]="true">
      <textarea
        id="Comment"
        name="Comment"
        class="form-control"
        rows="3"
        [(ngModel)]="editedDisplayedCopy.comment"
      ></textarea>
    </control>

    <button-group>
      <button appButton buttonType="button" variant="secondary" (buttonClick)="onCancel()">
        Cancel
      </button>
      <button appButton buttonType="button" variant="secondary" (buttonClick)="onReturn()">
        Return game
      </button>
      <button appButton buttonType="submit" variant="primary" [disabled]="f.invalid">Update</button>
    </button-group>
  </form>
</modal>
