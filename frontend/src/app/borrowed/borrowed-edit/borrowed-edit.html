<app-modal label="Edit borrowed game" (dismissed)="onCancel()">
  <form #f="ngForm" (ngSubmit)="onSubmit()" class="modal-card">
    <app-control label="Game" [required]="false">
      <span class="input-group-text">{{ selectedGame?.name }}</span>
    </app-control>

    <app-control label="Copy" [required]="false">
      <span class="input-group-text">{{ displayedCopy.id }}</span>
    </app-control>

    <app-control label="Responsible Person" forId="person" [required]="false">
      <input
        type="text"
        id="person"
        name="person"
        class="form-control"
        [(ngModel)]="editedDisplayedCopy.responsiblePerson"
      />
    </app-control>

    <app-control label="Weight" forId="Weight" [required]="true">
      <input
        type="number"
        step="0.01"
        id="Weight"
        name="Weight"
        class="form-control"
        [(ngModel)]="editedDisplayedCopy.weight"
        required
      />
    </app-control>

    <app-control label="Comment" forId="Comment" [required]="false">
      <textarea
        id="Comment"
        name="Comment"
        class="form-control"
        rows="3"
        [(ngModel)]="editedDisplayedCopy.comment"
      ></textarea>
    </app-control>

    <app-button-group>
      <button app-button buttonType="button" variant="secondary" (buttonClick)="onCancel()">
        Cancel
      </button>
      <button
        app-button
        buttonType="button"
        variant="secondary"
        [disabled]="f.invalid"
        (buttonClick)="onReturn()"
      >
        Return game
      </button>
      <button app-button buttonType="submit" variant="primary" [disabled]="f.invalid">
        Update
      </button>
    </app-button-group>
  </form>
</app-modal>
