<div class="backdrop" (click)="onCancel()"></div>

<dialog open>
  <form #f="ngForm" (ngSubmit)="onSubmit()" class="modal-card">
    <control label="Game" forId="Game" [required]="false">
      <span class="input-group-text" id="Game">{{ selectedGame?.name }}</span>
    </control>

    <control label="Copy" forId="Copy" [required]="false">
      <span class="input-group-text" id="Copy">{{ displayedCopy.id }}</span>
    </control>

    <control label="Responsible Person" forId="person" [required]="false">
      <input
        type="text"
        id="person"
        name="person"
        class="form-control"
        [(ngModel)]="editedDisplayedCopy.responsiblePerson"
      />
    </control>

    <control label="Weight" forId="Weight" [required]="true">
      <input
        type="number"
        step="0.01"
        id="Weight"
        name="Weight"
        class="form-control"
        [(ngModel)]="editedDisplayedCopy.weight"
        required
      />
    </control>

    <control label="Comment" forId="Comment" [required]="true">
      <textarea
        id="Comment"
        name="Comment"
        class="form-control"
        rows="3"
        [(ngModel)]="editedDisplayedCopy.comment"
      ></textarea>
    </control>

    <div class="actions d-flex justify-content-end gap-2 mt-3">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn btn-secondary" (click)="onReturn()">Return game</button>
      <button type="submit" class="btn btn-primary" [disabled]="f.invalid">Update</button>
    </div>
  </form>
</dialog>
