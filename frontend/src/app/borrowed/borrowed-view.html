<!-- search -->
<div class="borrowed">
  <div class="container pt-2">
    <form class="row g-2 py-3">
      <div class="col">
        <label class="visually-hidden" for="searchGame">Game name</label>
        <input
          id="searchGame"
          type="search"
          class="form-control"
          name="searchGame"
          placeholder="Game name"
          [ngModel]="searchGame"
          (ngModelChange)="onGameSearchChange($event)"
        />
      </div>
      <div class="col">
        <label class="visually-hidden" for="searchPerson">Person who borrowed the game</label>
        <input
          id="searchPerson"
          type="search"
          name="searchPerson"
          class="form-control"
          placeholder="Person who borrowed the game"
          [ngModel]="searchPerson"
          (ngModelChange)="onPersonSearchChange($event)"
        />
      </div>
    </form>
    <!-- list of borrowed games -->
    <table class="table table-striped table-hover table-hover-custom align-middle">
      <thead class="table-light">
        <tr>
          <th style="width: 7%">Copy#</th>
          <th style="width: 15%">Game</th>
          <th style="width: 20%">Responsible person</th>
          <th style="width: 45%">Comment</th>
          <th style="width: 6%">Weight</th>
          <th style="width: 8%"></th>
        </tr>
      </thead>
      <tbody>
        @for (copy of filteredCopies; track copy.id) {
        <tr>
          <th>{{ copy.id }}</th>
          <td>{{ copy.gameName }}</td>
          <td>{{ copy.responsiblePerson }}</td>
          <td>{{ copy.comment }}</td>
          <td>{{ copy.weight }}</td>
          <td class="text-nowrap">
            <button
              type="button"
              class="btn btn-outline-secondary btn-icon me-1"
              [attr.aria-label]="'Edit borrowing for ' + copy.gameName"
              (click)="onEditBorrowedGame(copy.id)"
            >
              <i class="bi bi-pencil" aria-hidden="true"></i>
            </button>
            <button
              type="button"
              class="btn btn-outline-secondary btn-icon"
              [attr.aria-label]="'Return ' + copy.gameName"
              (click)="returnBorrowedGame(copy.id)"
            >
              <i class="bi bi-box-arrow-in-down" aria-hidden="true"></i>
            </button>
          </td>
        </tr>
        }
      </tbody>
    </table>

    <!-- Borrow game button -->
    <button
      type="button"
      class="borrow-game-button rounded-circle"
      aria-label="Borrow a game"
      (click)="onStartBorrowingGame()"
    >
      <i class="bi bi-plus-lg" aria-hidden="true"></i>
    </button>

    <!-- Borrowing game window -->
    @if (isBorrowingGame){
    <app-borrowed-add (closed)="onCloseBorrowingGame()" />
    }
    <!-- Edit borrowed game record -->
    @if (isEditingGame){
    <app-borrowed-edit (closed)="onCloseEditBorrowedGame()" [copyId]="editingCopyId" />
    }
  </div>
</div>
