<app-modal
  [label]="editTypeDisplay === 'C' ? 'Edit copy' : 'Edit game'"
  (dismissed)="onCancel()"
>
  <form #f="ngForm" (ngSubmit)="onSubmit()">
    @if (editTypeDisplay === 'C') {
    <h2>Edit Copy</h2>
    <app-control label="Copy" forId="Copy" [required]="true">
      <select
        id="Copy"
        name="Copy"
        class="form-select"
        required
        [(ngModel)]="updateCopy.id"
        (ngModelChange)="onCopySelect($event)"
      >
        <option disabled value="">Select a copy to edit</option>
        @for (copy of copies; track copy.id) {
        <option [value]="copy.id">{{ copy.id }}</option>
        }
      </select>
    </app-control>

    @if (updateCopy.id) {
    <app-control label="Weight" forId="weight" [required]="true">
      <input
        id="weight"
        name="weight"
        type="number"
        step="0.01"
        class="form-control"
        [(ngModel)]="updateCopy.weight"
        required
        placeholder="e.g. 3"
      />
    </app-control>

    <app-control label="Comment" forId="copyComment" [required]="false">
      <textarea
        id="copyComment"
        name="copyComment"
        class="form-control"
        [(ngModel)]="updateCopy.comment"
        rows="3"
        placeholder="Used copy, tiles slightly scratched."
      ></textarea>
    </app-control>
    }
    } @else if (editTypeDisplay === 'G') {
    <h2>Edit Game</h2>
    <app-control label="Game" forId="Game" [required]="true">
      <select
        id="Game"
        name="Game"
        required
        class="form-select"
        [(ngModel)]="updateGame.id"
        (ngModelChange)="onGameSelect($event)"
      >
        <option disabled value="">Select a game</option>
        @for (game of games; track game.id) {
        <option [value]="game.id">{{ game.name }}</option>
        }
      </select>
    </app-control>

    @if (updateGame.id) {
    <app-control label="Game ID" forId="gameId" [required]="false">
      <input
        id="gameId"
        name="gameId"
        type="text"
        class="form-control"
        [(ngModel)]="updateGame.id"
        disabled
      />
    </app-control>

    <app-control label="Short description" forId="gameShortDescription" [required]="false">
      <input
        id="gameShortDescription"
        name="gameShortDescription"
        type="text"
        class="form-control"
        [(ngModel)]="updateGame.shortDescription"
        placeholder="Easy and fast game"
      />
    </app-control>

    <app-control label="Number of players" forId="gameNumberOfPlayers" [required]="true">
      <input
        id="gameNumberOfPlayers"
        name="gameNumberOfPlayers"
        type="text"
        class="form-control"
        [(ngModel)]="updateGame.numberOfPlayers"
        required
        placeholder="e.g. 2-5"
      />
    </app-control>

    <app-control label="Playing time" forId="gamePlayingTime" [required]="true">
      <input
        id="gamePlayingTime"
        name="gamePlayingTime"
        type="text"
        class="form-control"
        [(ngModel)]="updateGame.playingTime"
        required
        placeholder="e.g. 30-60 minutes"
      />
    </app-control>

    <app-control label="Min. age" forId="gameMinAge" [required]="false">
      <input
        id="gameMinAge"
        name="gameMinAge"
        type="number"
        class="form-control"
        [(ngModel)]="updateGame.minAge"
        placeholder="e.g. 11"
      />
    </app-control>

    <app-control label="Weight" forId="gameWeight" [required]="false">
      <input
        id="gameWeight"
        name="gameWeight"
        class="form-control"
        type="number"
        step="0.01"
        [(ngModel)]="updateGame.weight"
        placeholder="e.g. 3"
      />
    </app-control>

    <app-control label="Designer" forId="gameDesigner" [required]="true">
      <input
        id="gameDesigner"
        name="gameDesigner"
        type="text"
        class="form-control"
        [(ngModel)]="updateGame.designer"
        required
        placeholder="e.g. John Game Changer"
      />
    </app-control>

    <app-control label="Artist" forId="gameArtist" [required]="true">
      <input
        id="gameArtist"
        name="gameArtist"
        type="text"
        class="form-control"
        [(ngModel)]="updateGame.artist"
        required
        placeholder="e.g. Borys Art Maker"
      />
    </app-control>

    <app-control label="Comment" forId="gameComment" [required]="false">
      <textarea
        id="gameComment"
        name="gameComment"
        [(ngModel)]="updateGame.comment"
        class="form-control"
        rows="3"
        placeholder="Used copy, tiles slightly scratched."
      ></textarea>
    </app-control>
    }
    }

    <app-button-group>
      <button app-button buttonType="button" variant="secondary" (buttonClick)="onCancel()">
        Cancel
      </button>
      <button app-button buttonType="submit" variant="primary" [disabled]="f.invalid">
        Update
      </button>
    </app-button-group>
  </form>
</app-modal>
