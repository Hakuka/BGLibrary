<modal (backdropClick)="onCancel()">
  <form #f="ngForm" (ngSubmit)="onSubmit()">
    @if (removeTypeDisplay === 'C'){
    <control label="Copy" forId="Copy" [required]="true">
      <select id="Copy" name="Copy" class="form-select" required [(ngModel)]="selectedItemId">
        <option disabled value="">Select a copy to remove</option>
        @for (copy of copies; track copy.id) {
        <option [value]="copy.id">{{ copy.id }}</option>
        }
      </select>
    </control>
    } @else if (removeTypeDisplay === 'G') {
    <control label="Game" forId="Game" [required]="true">
      <select id="Game" name="Game" class="form-select" required [(ngModel)]="selectedItemId">
        <option disabled selected value="">Select a game to remove (with all copies)</option>
        @for (game of games; track game.id) {
        <option [value]="game.id">{{ game.name }}</option>
        }
      </select>
    </control>
    }
    <p class="actions">
      <button type="button" (click)="onCancel()">Cancel</button>
      <button type="submit" [disabled]="f.invalid">Remove</button>
    </p>
  </form>
</modal>
